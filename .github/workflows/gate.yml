# PROVA, DA NON UNIRE: ripete le prove WebKit per misurare quanto spesso il
# browser si chiude da solo (corsa 38303993696 su main, commit a247868).
name: Gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps webkit

      - name: Venti corse di test:webkit
        run: |
          mkdir -p corse
          verdi=0; rosse=0
          for i in $(seq 1 20); do
            if DEBUG=pw:browser npx vitest run --project=storybook-webkit --reporter=verbose > corse/$i.log 2>&1; then
              verdi=$((verdi+1)); echo "corsa $i: verde"
            else
              rosse=$((rosse+1)); echo "corsa $i: ROSSA"
              echo "::group::corsa $i, prove e errori"
              perl -pe 's/\e\[[0-9;]*m//g' corse/$i.log | grep -E "✓|×|↓ .*segnaposto|FAIL|Caused by|Failed to run|Tests |Test Files|pw:browser.*(crash|exit|signal|closed|kill|SIG)|AssertionError|Expected|Received" | grep -v "0 test" | tail -80
              echo "::endgroup::"
            fi
          done
          echo "verdi $verdi, rosse $rosse"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corse
          path: corse
